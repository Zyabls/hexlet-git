name: Build offline T3MP3ST Proxmox LXC template

on:
  push:
    branches:
      - artifact/t3mp3st-proxmox-lxc-20260803
    paths:
      - .github/workflows/build-t3mp3st-lxc.yml
      - offline-image/**
      - t3mp3st-proxmox-lxc-afc9dad1-20260803.tar.gz
      - t3mp3st-proxmox-lxc-afc9dad1-20260803.tar.gz.sha256
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: t3mp3st-offline-lxc
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RELEASE_TAG: t3mp3st-lxc-offline-20260803
    steps:
      - name: Clone artifact branch
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          git clone --depth 1 --branch "$GITHUB_REF_NAME" "$SOURCE_URL" "$GITHUB_WORKSPACE/src"

      - name: Build and verify rootfs template
        id: build
        run: |
          set +e
          sudo bash "$GITHUB_WORKSPACE/src/offline-image/build.sh" "$GITHUB_WORKSPACE/out" \
            > >(tee "$GITHUB_WORKSPACE/build.log") 2>&1
          build_status=$?
          echo "status=$build_status" >> "$GITHUB_OUTPUT"
          exit "$build_status"

      - name: Preserve failed build diagnostics on the artifact branch
        if: failure() && steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -n 500 "$GITHUB_WORKSPACE/build.log" > "$GITHUB_WORKSPACE/LAST_BUILD_FAILURE.log"
          log_content="$(base64 -w0 "$GITHUB_WORKSPACE/LAST_BUILD_FAILURE.log")"
          api_path="repos/$GITHUB_REPOSITORY/contents/offline-image/LAST_BUILD_FAILURE.log"
          current_sha="$(gh api -X GET "$api_path" -f ref="$GITHUB_REF_NAME" --jq .sha 2>/dev/null || true)"
          args=(-X PUT -f "message=Record failed offline image build" -f "content=$log_content" -f "branch=$GITHUB_REF_NAME")
          if [[ -n "$current_sha" ]]; then
            args+=(-f "sha=$current_sha")
          fi
          gh api "$api_path" "${args[@]}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE/src"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$GITHUB_WORKSPACE"/out/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "$GITHUB_WORKSPACE"/out/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "T3MP3ST offline Proxmox LXC (2026-08-03)" \
              --notes-file offline-image/RELEASE_NOTES_RU.md
          fi
