map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/t3mp3st/tls/server.crt;
    ssl_certificate_key /etc/t3mp3st/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    auth_basic "T3MP3ST";
    auth_basic_user_file /etc/t3mp3st/nginx.htpasswd;

    client_max_body_size 32m;
    proxy_connect_timeout 30s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:3333;
        # The backend is loopback-only and enforces a localhost Origin guard.
        # nginx is the authenticated security boundary for the LAN UI, so pass
        # its requests using the backend's canonical loopback origin.
        proxy_set_header Origin http://127.0.0.1:3333;
        proxy_set_header Referer http://127.0.0.1:3333/;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
    }
}
